name: crate_barrier
description: >-
  A row of crates stands across the room in front of the robot. A yellow
  marker is painted on the floor somewhere behind the crates.
walls: {half_size: [2.0, 2.0], height: 0.25}
robot_start: {pos: [-1.0, 0.0], yaw_deg: 0}
objects:
  - {name: crate_a, shape: box, size: [0.15, 0.2, 0.2], pos: [0.3, -0.4], color: blue, movable: false}
  - {name: crate_b, shape: box, size: [0.15, 0.2, 0.2], pos: [0.3, 0.0], color: blue, movable: false}
  - {name: crate_c, shape: box, size: [0.15, 0.2, 0.2], pos: [0.3, 0.4], color: blue, movable: false}
  - {name: yellow_marker, shape: region, size: [0.2, 0.2], pos: [1.2, 0.0], place_in: [[1.0, 1.5], [-0.4, 0.4]], color: yellow, kind: marker}
